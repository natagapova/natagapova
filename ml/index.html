<body class="page-ml">

  <nav class="top-navbar top-navbar--subpage top-navbar--centered">
    <div class="navbar-left">
      <a href="/" class="navbar-back" id="back-home" aria-label="back to home">
        <span class="navbar-back__icon" aria-hidden="true">←</span>
      </a>
    </div>

    <div class="navbar-center">
      <span class="navbar-page-title" id="ml-page-title">ml cases</span>
    </div>

    <div class="navbar-right">
      <button type="button" id="languageSwitch" aria-label="Переключить интерфейс на русский">рус</button>
      <button
        type="button"
        class="btn btn--ghost navbar-cv"
        id="navbar-cv-download"
        aria-label="download cv"
        aria-haspopup="menu"
        aria-expanded="false"
      >
        <span class="btn__label" id="navbar-cv-label">CV</span>
      </button>
    </div>
  </nav>

  <main class="subpage-main ml-page">
    <section class="page-intro-section" aria-labelledby="ml-intro-section-title">
      <div class="editorial-panel intro-panel">
        <h2 class="intro-section__title" id="ml-intro-section-title">
          <span id="ml-intro-title">my ml experience</span>
        </h2>
        <p class="intro-section__lead" id="ml-intro-lead">
          i do applied ML: BERT, XAI and debiasing, RAG, computer vision. i publish my work and ship models that are accurate, explainable, and grounded in real product context.
        </p>
        <ul class="page-intro-skills" id="ml-skills" role="list"></ul>
      </div>
    </section>
    <div class="ml-grid" id="ml-grid" role="list"></div>
  </main>

  <footer class="footer">
    <nav class="footer-social" id="footer-social" aria-label="social links"></nav>
    <span class="footer-copy">natalia agapova</span>
  </footer>

  <div id="project-overlay" class="project-overlay" hidden>
    <button type="button" class="project-overlay__backdrop" aria-label="close"></button>
    <div
      class="project-overlay__panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="project-overlay-title"
    >
      <button type="button" class="project-overlay__close" id="project-overlay-close" aria-label="close">
        <span aria-hidden="true">×</span>
      </button>
      <div class="project-overlay__scroll" id="project-overlay-scroll">
        <div class="project-overlay__heading">
          <h2 class="project-overlay__title" id="project-overlay-title"></h2>
          <span class="ml-card__status" id="project-overlay-status" hidden></span>
        </div>
        <div class="project-overlay__tools" id="project-overlay-tools"></div>
        <div class="project-overlay__actions" id="project-overlay-actions" hidden></div>
        <p class="project-overlay__desc" id="project-overlay-desc"></p>
        <div class="project-overlay__process" id="project-overlay-process" hidden></div>
        <div class="project-overlay__gallery" id="project-overlay-gallery"></div>
      </div>
    </div>
  </div>

  <div id="project-lightbox" class="lightbox hidden" hidden>
    <button type="button" class="lightbox-close" id="project-lightbox-close" aria-label="close">×</button>
    <button type="button" class="lightbox-nav lightbox-nav--prev" id="project-lightbox-prev" aria-label="previous">‹</button>
    <button type="button" class="lightbox-nav lightbox-nav--next" id="project-lightbox-next" aria-label="next">›</button>
    <div class="lightbox-content" id="project-lightbox-content"></div>
  </div>

</body>
