<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Портфолио Натальи Агаповой — UX/UI и продуктовый дизайн, вёрстка, проекты для Яндекса, Innopolis и др.">
  <title>natalia's portfolio</title>
  <link rel="icon" type="image/webp" href="images/favicon.webp">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/script.js"></script>
  <script defer src="js/cursor-trail.js"></script>
  <script defer src="js/mobile-hero.js"></script>
</head>
<body>

  <section class="hero-experience" id="hero-experience" aria-label="Направления">
    <div class="hero-experience__pin" id="hero-experience-pin">
      <nav class="top-navbar top-navbar--hero">
        <div class="navbar-left">
          <span id="nav-brand">наталья агапова</span>
        </div>
        <div class="navbar-right">
          <button type="button" id="languageSwitch" aria-label="Switch interface language to English">eng</button>
        </div>
      </nav>
      <header class="hero-intro">
    <div class="hero-intro__stage">
      <h1 class="hero-intro__name" id="store-name">
        <span class="hero-intro__title-line"
          ><span class="hero-word">к<span class="hero-letter-gap-kt">т</span>о</span>
          <span class="hero-word">она?</span></span
        >
      </h1>
      <div class="hero-intro__photo-wrap" id="hero-photo-wrap">
        <div class="hero-intro__photo-stack">
          <img
            class="hero-intro__photo hero-intro__photo--open"
            src="images/my-head.png"
            alt=""
            width="2392"
            height="3503"
            decoding="async"
          />
          <img
            class="hero-intro__photo hero-intro__photo--closed"
            src="images/my-head-eyesclosed.png"
            alt=""
            width="832"
            height="1248"
            decoding="async"
            aria-hidden="true"
          />
        </div>
      </div>
      <nav class="roles-nav roles-nav--hero" id="hero-roles-nav" aria-label="Роли">
            <a href="designer.html" class="role-card role-card--designer role-card--thought">
              <img
                class="role-card__thought-img"
                src="images/thought2.png"
                alt=""
                width="1796"
                height="1248"
                decoding="async"
              />
              <span class="role-card__thought-body">
                <span class="role-card__label" id="role-designer">дизайнер</span>
                <span class="role-card__chip" aria-hidden="true">→</span>
              </span>
            </a>
            <a href="ml.html" class="role-card role-card--frontend role-card--thought">
              <img
                class="role-card__thought-img"
                src="images/thought1.png"
                alt=""
                width="1833"
                height="1190"
                decoding="async"
              />
              <span class="role-card__thought-body">
                <span class="role-card__label" id="role-ml">ML разработчик</span>
                <span class="role-card__chip" aria-hidden="true">→</span>
              </span>
            </a>
            <a href="frontend.html" class="role-card role-card--ml role-card--thought">
              <img
                class="role-card__thought-img"
                src="images/thought3.png"
                alt=""
                width="1742"
                height="1176"
                decoding="async"
              />
              <span class="role-card__thought-body">
                <span class="role-card__label" id="role-frontend">frontend разработчик</span>
                <span class="role-card__chip" aria-hidden="true">→</span>
              </span>
            </a>
            <a href="person.html" class="role-card role-card--person role-card--thought">
              <img
                class="role-card__thought-img"
                src="images/thought4.png"
                alt=""
                width="1975"
                height="1338"
                decoding="async"
              />
              <span class="role-card__thought-body">
                <span class="role-card__label" id="role-person">человек</span>
                <span class="role-card__chip" aria-hidden="true">→</span>
              </span>
            </a>
          </nav>
    </div>
      </header>
    </div>
    <div class="hero-experience__clouds" id="hero-clouds">
      <div class="hero-experience__clouds-pin" id="hero-clouds-pin"></div>
      <div class="hero-experience__clouds-track" id="hero-clouds-track" aria-hidden="true"></div>
    </div>
    <div class="hero-experience__track" id="hero-experience-track" aria-hidden="true"></div>
  </section>

  <section class="languages-section" aria-labelledby="languages-section-title">
    <div class="languages-section__inner">
      <h2 class="languages-section__title" id="languages-section-title">
        <span id="languages-block-title">языки</span>
      </h2>
      <div class="lang-map" id="lang-map" role="group" aria-describedby="lang-map-desc">
        <p class="visually-hidden" id="lang-map-desc">
          Карта владения языками по шкале от A1 до C2.
        </p>
        <div class="lang-map__glow" id="lang-map-glow" aria-hidden="true">
          <canvas class="lang-map__canvas" id="lang-map-canvas"></canvas>
        </div>
        <div class="lang-map__rows">
          <div class="lang-map__row lang-map__row--ru">
            <span class="lang-map__label lang-map__label--left" id="lang-ru-name">русский</span>
            <div class="lang-map__track">
              <div class="lang-map__rail">
                <span class="lang-map__line" aria-hidden="true"></span>
                <span class="lang-map__anchor" style="--anchor-i: 0"></span>
                <span class="lang-map__anchor" style="--anchor-i: 1"></span>
                <span class="lang-map__anchor" style="--anchor-i: 2"></span>
                <span class="lang-map__anchor" style="--anchor-i: 3"></span>
                <span class="lang-map__anchor" style="--anchor-i: 4"></span>
                <span class="lang-map__anchor lang-map__anchor--active" style="--anchor-i: 5"><span class="lang-map__anchor-core" aria-hidden="true"></span></span>
              </div>
            </div>
            <span class="lang-map__label lang-map__label--right">C2</span>
          </div>
          <div class="lang-map__row lang-map__row--en">
            <span class="lang-map__label lang-map__label--left" id="lang-en-name">английский</span>
            <div class="lang-map__track">
              <div class="lang-map__rail">
                <span class="lang-map__line" aria-hidden="true"></span>
                <span class="lang-map__anchor" style="--anchor-i: 0"></span>
                <span class="lang-map__anchor" style="--anchor-i: 1"></span>
                <span class="lang-map__anchor" style="--anchor-i: 2"></span>
                <span class="lang-map__anchor" style="--anchor-i: 3"></span>
                <span class="lang-map__anchor" style="--anchor-i: 4"></span>
                <span class="lang-map__anchor" style="--anchor-i: 5"></span>
                <span class="lang-map__anchor lang-map__anchor--active" style="--anchor-i: 4.5"><span class="lang-map__anchor-core" aria-hidden="true"></span></span>
              </div>
            </div>
            <span class="lang-map__label lang-map__label--right" id="lang-en-level">C1+</span>
          </div>
          <div class="lang-map__row lang-map__row--fr">
            <span class="lang-map__label lang-map__label--left" id="lang-fr-name">французский</span>
            <div class="lang-map__track">
              <div class="lang-map__rail">
                <span class="lang-map__line" aria-hidden="true"></span>
                <span class="lang-map__anchor" style="--anchor-i: 0"></span>
                <span class="lang-map__anchor lang-map__anchor--active" style="--anchor-i: 1"><span class="lang-map__anchor-core" aria-hidden="true"></span></span>
                <span class="lang-map__anchor" style="--anchor-i: 2"></span>
                <span class="lang-map__anchor" style="--anchor-i: 3"></span>
                <span class="lang-map__anchor" style="--anchor-i: 4"></span>
                <span class="lang-map__anchor" style="--anchor-i: 5"></span>
              </div>
            </div>
            <span class="lang-map__label lang-map__label--right">A2</span>
          </div>
          <div class="lang-map__row lang-map__row--ko">
            <span class="lang-map__label lang-map__label--left" id="lang-ko-name">корейский</span>
            <div class="lang-map__track">
              <div class="lang-map__rail">
                <span class="lang-map__line" aria-hidden="true"></span>
                <span class="lang-map__anchor lang-map__anchor--active" style="--anchor-i: 0"><span class="lang-map__anchor-core" aria-hidden="true"></span></span>
                <span class="lang-map__anchor" style="--anchor-i: 1"></span>
                <span class="lang-map__anchor" style="--anchor-i: 2"></span>
                <span class="lang-map__anchor" style="--anchor-i: 3"></span>
                <span class="lang-map__anchor" style="--anchor-i: 4"></span>
                <span class="lang-map__anchor" style="--anchor-i: 5"></span>
              </div>
            </div>
            <span class="lang-map__label lang-map__label--right">A1</span>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="about-section">
    <div class="about-columns">
      <div class="about-block">
        <h3 id="experience-block-title">опыт</h3>
        <ul>
          <li><span id="exp-croissan"></span></li>
          <li><span id="exp-azimov"></span></li>
          <li><span id="exp-clearmind"></span></li>
        </ul>
      </div>
      <div class="about-block">
        <h3 id="volunteering-block-title">волонтёрство</h3>
        <ul>
          <li><span id="vol-trenirovochnaya"></span></li>
          <li><span id="vol-innostreetdance"></span></li>
        </ul>
      </div>
      <div class="about-block">
        <h3 id="education-block-title">образование</h3>
        <ul>
          <li><span id="edu-innopolis"></span></li>
        </ul>
      </div>
    </div>
  </section>

  <footer class="footer">
    <nav class="footer-social" id="footer-social" aria-label="соцсети"></nav>
    <span class="footer-copy">natalia agapova</span>
  </footer>

</body>
</html>
